<!DOCTYPE html>
<!--
  playMode.html
  Purpose: UI for presenting a saved Jeopardy game. Renders the game board
  and provides a modal to show the selected question and reveal the answer.
-->
<html>
<head>
  <title>Play Jeopardy</title>
  <link rel="stylesheet" href="../css/pmStyle.css" />
</head>
<body>
  <h1 id="gameTitle"></h1>
  <div id="board"></div>

  <div id="modal">
    <h2 id="modalQuestion"></h2>
    <p id="modalAnswer"></p>
    <button id="revealBtn">Reveal Answer</button>
    <button id="closeBtn">Close</button>
  </div>

  <script src="../js/playMode.js"></script>
</body>
</html>
