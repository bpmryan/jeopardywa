<!DOCTYPE html>
<!--
  gameContent.html
  Purpose: Main editor page for creating or editing a Jeopardy game. Loads
  category and QnA partials and wires the editor script `gameCreate.js`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Creation</title>
    <link rel="stylesheet" href="../css/gcStyle.css" />
  </head>
  <!-- Main file that displays the "create game area" -->

  <body>
    <header>
      <nav>
        <h1>Jeopardy Template/Creation Thingy Space</h1>
        <div>
          <label>Game Name: <input id="gameName" /></label>
          <button id="saveGameBtn">Save All</button>
          <button id="back">
            <a href="../jeopardyDash/Dashboard.html">Back</a>
          </button>
          <button id="addCategory">Add Category</button>
          <button>Preview Game</button>
        </div>
      </nav>
      <div id="mainContainer">
        <!-- CategoryItem should pop up here -->
      </div>
    </header>
    
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!localStorage.getItem("userId")) {
          window.location.href = "../userAuthen/Login.html";
        }
      });
    </script>

    <script src="../js/gameCreate.js"></script>
  </body>
</html>
